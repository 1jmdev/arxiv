[package]
name = "arxiv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
flate2 = "1.1.10"
fs2 = "0.4.3"
pdf-extract = "0.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
